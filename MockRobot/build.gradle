plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jetbrains.compose' version '1.10.3'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20'
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation 'org.json:json:20240303'
    implementation compose.desktop.currentOs
    implementation 'org.jetbrains.compose.material3:material3:1.10.0-alpha05'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            // Compile the same protocol/server sources that are installed on the robot.
            srcDir '../TeamCode/src/main/java'

            include 'android/os/SystemClock.java'
            include 'android/util/Log.java'
            include 'org/firstinspires/ftc/mockrobot/**'
            include 'org/firstinspires/ftc/teamcode/common/network/JsonUtil.java'
            include 'org/firstinspires/ftc/teamcode/common/network/SessionLease.java'
            include 'org/firstinspires/ftc/teamcode/common/network/ControlMailbox.java'
            include 'org/firstinspires/ftc/teamcode/common/network/ControlGate.java'
            include 'org/firstinspires/ftc/teamcode/common/network/ControlRequest.java'
            include 'org/firstinspires/ftc/teamcode/common/network/ExecutionStateStore.java'
            include 'org/firstinspires/ftc/teamcode/common/network/RobotRuntimeStore.java'
            include 'org/firstinspires/ftc/teamcode/common/network/CommandCatalog.java'
            include 'org/firstinspires/ftc/teamcode/common/network/RouteRepository.java'
            include 'org/firstinspires/ftc/teamcode/common/network/RobotApiRouter.java'
            include 'org/firstinspires/ftc/teamcode/common/network/RobotEventStream.java'
            include 'org/firstinspires/ftc/teamcode/common/network/http/**'
            include 'org/firstinspires/ftc/teamcode/common/opmode/OpModeLifecycleService.java'
        }
    }
}

compose.desktop {
    application {
        mainClass = 'org.firstinspires.ftc.mockrobot.MockRobotMainKt'
        jvmArgs(
            '-Dfile.encoding=UTF-8',
            '--enable-native-access=ALL-UNNAMED'
        )
    }
}
